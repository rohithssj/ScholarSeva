<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Scholarships - ScholarSeva</title>
    <link rel="icon" type="image/png" href="icon/ChatGPT Image Feb 24, 2026, 12_33_15 AM.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .compare-section {
            padding: 120px 0 80px;
            min-height: 80vh;
        }

        .compare-container {
            overflow-x: auto;
            background: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: var(--radius-lg);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-primary);
        }

        .compare-table th,
        .compare-table td {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .compare-table th {
            color: var(--accent-gold);
            font-weight: 600;
            width: 200px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .compare-table tr:last-child td,
        .compare-table tr:last-child th {
            border-bottom: none;
        }

        .comparison-name {
            font-family: "Playfair Display", serif;
            font-size: 1.25rem;
            color: var(--accent-gold-light);
            margin: 0;
        }

        .empty-compare {
            text-align: center;
            padding: 100px 0;
        }

        .btn-remove-compare {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 16px;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .btn-remove-compare:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>
    <!-- ============= NAVBAR ============= -->
    <header class="navbar">
        <div class="container nav">
            <a href="index.html" class="logo-wrapper">
                <img src="icon/ChatGPT Image Feb 24, 2026, 12_33_15 AM.png" alt="ScholarSeva Logo" class="logo-icon">
                <div class="logo">ScholarSeva</div>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="scholarships.html">Scholarships</a>
                <a href="index.html#about">About</a>
            </nav>
        </div>
    </header>

    <section class="compare-section">
        <div class="container">
            <h2 style="text-align: center; margin-bottom: 40px;">Compare Scholarships</h2>
            
            <div id="compare-view-container">
                <!-- Comparison table will be loaded here -->
                <div class="empty-compare">
                    <p>No scholarships selected for comparison.</p>
                    <a href="scholarships.html" class="btn btn-secondary btn2" style="display: inline-block; margin-top: 20px;">Browse Scholarships</a>
                </div>
            </div>
        </div>
    </section>

    <!-- ============= FOOTER ============= -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 ScholarSeva. All rights reserved. | Empowering Students Through Scholarships</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Specific logic for compare page
        document.addEventListener('DOMContentLoaded', async () => {
            // Wait for allScholarships to load from script.js
            // Since loadScholarships is called in script.js on DOMContentLoaded, 
            // we should wait a bit or hook into it.
            // Simplified: Re-load if needed or check if already loaded.
            
            async function initCompare() {
                if (allScholarships.length === 0) {
                    await loadScholarships();
                }
                renderComparePage();
            }

            function renderComparePage() {
                const container = document.getElementById('compare-view-container');
                const list = JSON.parse(localStorage.getItem('compareList')) || [];
                
                if (list.length === 0) return;

                const selected = allScholarships.filter(s => list.includes(s.id));
                
                let html = `
                    <div class="compare-container">
                        <table class="compare-table">
                            <tr>
                                <th>Feature</th>
                                ${selected.map(s => `
                                    <td>
                                        <h4 class="comparison-name">${s.name}</h4>
                                        <button class="btn btn-remove-compare" onclick="removeFromComparePage('${s.id}')">Remove</button>
                                    </td>
                                `).join('')}
                            </tr>
                            <tr>
                                <th>Provider</th>
                                ${selected.map(s => `<td>${s.provider}</td>`).join('')}
                            </tr>
                            <tr>
                                <th>State</th>
                                ${selected.map(s => `<td>${s.state}</td>`).join('')}
                            </tr>
                            <tr>
                                <th>Education</th>
                                ${selected.map(s => `<td>${s.education_level}</td>`).join('')}
                            </tr>
                            <tr>
                                <th>Income Limit</th>
                                ${selected.map(s => `<td>₹${formatCurrency(s.income_limit.value)}</td>`).join('')}
                            </tr>
                            <tr>
                                <th>Category</th>
                                ${selected.map(s => `<td>${s.category}</td>`).join('')}
                            </tr>
                            <tr>
                                <th>Action</th>
                                ${selected.map(s => `<td><a href="${s.apply_link.url}" target="_blank" class="btn-apply btn" style="font-size: 0.8rem; padding: 10px 15px;">Apply Now</a></td>`).join('')}
                            </tr>
                        </table>
                    </div>
                `;
                container.innerHTML = html;
            }

            window.removeFromComparePage = (id) => {
                removeFromCompare(id);
                renderComparePage();
            };

            initCompare();
        });
    </script>
</body>

</html>
